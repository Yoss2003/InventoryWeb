<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" [opened]="isSidebarOpen()" class="sidenav">
    <div class="logo-container">
      <h2>Inventario Pro</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard/articulos" routerLinkActive="active-link">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <div matListItemTitle>Maestro de Artículos</div>
      </a>
      <a mat-list-item routerLink="/dashboard/categorias" routerLinkActive="active-link">
        <mat-icon matListItemIcon>category</mat-icon>
        <div matListItemTitle>Categorías</div>
      </a>
      <a mat-list-item routerLink="/dashboard/entradas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <div matListItemTitle>Entradas</div>
      </a>
      <a mat-list-item routerLink="/dashboard/salidas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>remove_circle</mat-icon>
        <div matListItemTitle>Salidas</div>
      </a>
      <a mat-list-item routerLink="/dashboard/asignaciones" routerLinkActive="active-link">
        <mat-icon matListItemIcon>assignment_ind</mat-icon>
        <div matListItemTitle>Artículos asignados</div>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="top-toolbar">
      <button mat-icon-button (click)="toggleSidebar()" style="margin-right: 15px;">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Panel de Gestión</span>
      <span class="spacer"></span>
      <button mat-icon-button (click)="logout()" title="Cerrar Sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
