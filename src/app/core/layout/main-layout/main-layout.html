<mat-sidenav-container class="sidenav-container" [class.sidebar-expanded]="isSidebarOpen()" [class.sidebar-collapsed]="!isSidebarOpen()">
  <mat-sidenav mode="side" [opened]="true" class="sidenav" [class.expanded]="isSidebarOpen()" [class.collapsed]="!isSidebarOpen()">
    <div class="logo-container"><span class="logo-mark"><mat-icon>inventory_2</mat-icon></span><span class="logo-label" [attr.aria-hidden]="!isSidebarOpen()">OmniStock</span></div>
    
    <nav class="sidebar-groups" aria-label="Navegación de inventario">

      <ng-container *ngFor="let group of menuGroups">

        <section class="sidebar-group" *ngIf="groupVisible(group)">

          <button
            type="button"
            class="sidebar-group-trigger"
            [class.group-active]="activeGroup() === group.id"
            [attr.aria-expanded]="isSidebarOpen() && expandedGroup() === group.id"
            [attr.aria-label]="group.title"
            [title]="group.title"
            (click)="toggleGroup(group.id)">

            <mat-icon>{{ group.icon }}</mat-icon>

            <span class="group-label" *ngIf="isSidebarOpen()">
              {{ group.title }}
            </span>

            <mat-icon class="group-chevron" *ngIf="isSidebarOpen()">
              {{ expandedGroup() === group.id ? 'expand_more' : 'chevron_right' }}
            </mat-icon>

          </button>

          <mat-nav-list class="sidebar-group-items" [class.is-open]="isSidebarOpen() && expandedGroup() === group.id">

            <ng-container *ngFor="let item of group.items">
              <a
                *ngIf="canAccessItem(item)"
                mat-list-item
                [routerLink]="item.route"
                routerLinkActive="active-link"
                [title]="item.label">

                <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                <span matListItemTitle class="sidebar-label">{{ item.label }}</span>

              </a>
            </ng-container>

          </mat-nav-list>

        </section>

      </ng-container>

    </nav>

  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="top-toolbar">
      <button type="button" class="menu-trigger" (click)="toggleSidebar()" [attr.aria-expanded]="isSidebarOpen()" [attr.aria-label]="isSidebarOpen()?'Contraer menú':'Expandir menú'">
        <span class="hamburger" [class.open]="isSidebarOpen()" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <span class="current-title">{{ currentTitle() }}</span>
      <span class="spacer"></span>
      <label class="active-inventory-label" for="active-inventory-select">Inventario</label>
      <mat-form-field appearance="outline" class="active-inventory-field" subscriptSizing="dynamic">
        <mat-select id="active-inventory-select" aria-label="Inventario de trabajo"
          [value]="selectedInventoryId"
          (selectionChange)="selectInventoryById($event.value)"
          [disabled]="loadingInventories || !inventories.length"
          panelClass="inventory-select-options">
          <mat-option *ngIf="!inventories.length" [value]="null" disabled>{{loadingInventories ? 'Cargando...' : 'Sin inventario operativo'}}</mat-option>
          <mat-option *ngFor="let item of inventories" [value]="item.id">{{item.alias || item.inventoryName}} ({{item.id}})</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-icon-button (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión"><mat-icon>logout</mat-icon></button>
    </mat-toolbar>
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
