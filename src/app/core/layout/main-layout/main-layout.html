<mat-sidenav-container class="sidenav-container" [class.sidebar-expanded]="isSidebarOpen()" [class.sidebar-collapsed]="!isSidebarOpen()">
  <mat-sidenav mode="side" [opened]="true" class="sidenav" [class.expanded]="isSidebarOpen()" [class.collapsed]="!isSidebarOpen()">
    <div class="logo-container"><span class="logo-mark"><mat-icon>inventory_2</mat-icon></span><span class="logo-label" [attr.aria-hidden]="!isSidebarOpen()">Inventario Pro</span></div>
    <mat-nav-list aria-label="Navegación de inventario">
      <a mat-list-item routerLink="/dashboard/articulos" routerLinkActive="active-link" title="Maestro de artículos" aria-label="Maestro de artículos"><mat-icon matListItemIcon>inventory_2</mat-icon><span class="sidebar-label" matListItemTitle>Artículos</span></a>
      <a mat-list-item routerLink="/dashboard/categorias" routerLinkActive="active-link" title="Categorías" aria-label="Categorías"><mat-icon matListItemIcon>category</mat-icon><span class="sidebar-label" matListItemTitle>Categorías</span></a>
      <a mat-list-item routerLink="/dashboard/entradas" routerLinkActive="active-link" title="Entradas" aria-label="Entradas"><mat-icon matListItemIcon>add_circle</mat-icon><span class="sidebar-label" matListItemTitle>Entradas</span></a>
      <a mat-list-item routerLink="/dashboard/salidas" routerLinkActive="active-link" title="Salidas" aria-label="Salidas"><mat-icon matListItemIcon>remove_circle</mat-icon><span class="sidebar-label" matListItemTitle>Salidas</span></a>
      <a mat-list-item routerLink="/dashboard/asignaciones" routerLinkActive="active-link" title="Artículos asignados" aria-label="Artículos asignados"><mat-icon matListItemIcon>assignment_ind</mat-icon><span class="sidebar-label" matListItemTitle>Asignados</span></a>
      <a mat-list-item routerLink="/dashboard/compartir-inventario" routerLinkActive="active-link" title="Compartir inventario" aria-label="Compartir inventario"><mat-icon matListItemIcon>group_add</mat-icon><span class="sidebar-label" matListItemTitle>Compartir</span></a>
      <a mat-list-item routerLink="/dashboard/consultas" routerLinkActive="active-link" title="Consultas SUNAT y cambio" aria-label="Consultas SUNAT y cambio"><mat-icon matListItemIcon>currency_exchange</mat-icon><span matListItemTitle class="sidebar-label">Consultas</span></a>
      <a mat-list-item routerLink="/dashboard/catalogo-general" routerLinkActive="active-link" title="Catálogo general" aria-label="Catálogo general"><mat-icon matListItemIcon>collections_bookmark</mat-icon><span matListItemTitle class="sidebar-label">Catálogo general</span></a>
      <a mat-list-item *ngIf="isAdmin" routerLink="/dashboard/historial-general" routerLinkActive="active-link" title="Historial general" aria-label="Historial general"><mat-icon matListItemIcon>history</mat-icon><span matListItemTitle class="sidebar-label">Historial general</span></a>
      <a mat-list-item *ngIf="isDeveloper" routerLink="/dashboard/gestion-dev" routerLinkActive="active-link" title="Gestión Dev" aria-label="Gestión Dev"><mat-icon matListItemIcon>admin_panel_settings</mat-icon><span matListItemTitle class="sidebar-label">Gestión Dev</span></a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="top-toolbar">
      <button type="button" class="menu-trigger" (click)="toggleSidebar()" [attr.aria-expanded]="isSidebarOpen()" [attr.aria-label]="isSidebarOpen()?'Contraer menú':'Expandir menú'">
        <span class="hamburger" [class.open]="isSidebarOpen()" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <span class="current-title">{{ currentTitle() }}</span>
      <span class="spacer"></span>
      <label class="active-inventory-label" for="active-inventory-select">Inventario</label>
      <select id="active-inventory-select" class="active-inventory-select" [value]="selectedInventoryId ?? ''" (change)="selectInventory($event)" [disabled]="loadingInventories || !inventories.length" aria-label="Inventario de trabajo">
        <option *ngIf="!inventories.length" value="">{{loadingInventories ? 'Cargando...' : 'Sin inventarios'}}</option>
        <option *ngFor="let item of inventories" [value]="item.id">{{item.alias || item.inventoryName}} ({{item.id}})</option>
      </select>
      <button mat-icon-button (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión"><mat-icon>logout</mat-icon></button>
    </mat-toolbar>
    <div class="main-content"><router-outlet></router-outlet></div>
  </mat-sidenav-content>
</mat-sidenav-container>
