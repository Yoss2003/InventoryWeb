<h2 mat-dialog-title>{{ titulo }}</h2>

<mat-dialog-content>
  <form [formGroup]="movementForm" class="form-column" style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">
    
    <mat-form-field appearance="outline">
      <mat-label>Artículo</mat-label>
      <mat-select formControlName="articleId">
        @for(item of articles; track item.id) {
          <mat-option [value]="item.id">{{ item.name }} (Stock: {{ item.stock }})</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" formControlName="amount" min="0.01" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Observación (Opcional)</mat-label>
      <textarea matInput formControlName="observation" rows="2"></textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="movementForm.invalid" (click)="onSubmit()">
    Guardar Registro
  </button>
</mat-dialog-actions>
