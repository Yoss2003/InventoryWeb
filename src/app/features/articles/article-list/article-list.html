<mat-card class="dashboard-card">
  <mat-card-header class="dashboard-card-header">
    <mat-card-title>Catálogo de Artículos</mat-card-title>
    <div style="width: 140px;"></div>
  </mat-card-header>
  
  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="dashboard-table mat-elevation-z2">
      
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef> Código </th>
        <td mat-cell *matCellDef="let element"> {{element.code}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef> Modelo </th>
        <td mat-cell *matCellDef="let element"> {{element.model}} </td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef> Stock Actual </th>
        <td mat-cell *matCellDef="let element"> <strong>{{element.stock}}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="measurementUnit">
        <th mat-header-cell *matHeaderCellDef> Unidad </th>
        <td mat-cell *matCellDef="let element"> {{element.measurementUnit}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
