name: Validar WebInventory
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  angular:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Dependencias
        run: npm ci
      - name: Compilación
        run: npm run build
